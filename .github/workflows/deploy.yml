name: Deploy Next.js to cPanel

on:
  push:
    branches:
      - master

jobs:
  web-deploy:
    name: Build and Deploy Next.js
    runs-on: ubuntu-latest

    steps:
      - name: Checkout latest code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "yarn"

      - name: Install dependencies
        run: yarn install --frozen-lockfile

      - name: Build Next.js application
        run: yarn build
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY }}
          NEXT_PUBLIC_SUPABASE_SUBMIT_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_SUBMIT_URL }}
          NEXT_PUBLIC_SUPABASE_PUBLISHABLE_SUBMIT_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_PUBLISHABLE_SUBMIT_KEY }}

      - name: Deploy via FTPS
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          protocol: ftps
          port: 21
          local-dir: ./
          server-dir: ./
          dangerous-clean-slate: false
          timeout: 60000
          log-level: verbose
          exclude: |
            **/.git*
            **/.git*/**
            **/node_modules/**
            .next/trace
            .next/trace-build
            .next/turbopack
