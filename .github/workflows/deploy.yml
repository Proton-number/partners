name: Deploy Standalone Next.js to cPanel

on:
  push:
    branches:
      - master

jobs:
  web-deploy:
    name: Build and Standalone Transfer
    runs-on: ubuntu-latest
    steps:
      - name: Get latest code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "yarn"

      - name: Install dependencies
        run: yarn install --frozen-lockfile

      - name: Run Next.js Production Build
        run: yarn build

      - name: Prepare Standalone Artifact
        run: |
          mkdir -p ./deploy-package
          cp -r .next/standalone/* ./deploy-package/
          mkdir -p ./deploy-package/.next
          cp -r .next/static ./deploy-package/.next/static
          cp -r public ./deploy-package/public

      - name: Sync standalone bundle via FTP
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          protocol: ftps
          port: 21
          local-dir: ./deploy-package/
          server-dir: ./
          dangerous-clean-slate: false